<!DOCTYPE html>
<html>
<head>
  <title>Ambulance Panel</title>

  <style>
/* ================= GLOBAL ================= */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  font-family: 'Segoe UI', Arial, sans-serif;
}

/* ================= CONTAINER ================= */
.container {
  display: flex;
  height: 100vh;
  gap: 12px;
  padding: 12px;
  overflow: hidden;
}

/* ================= LEFT ================= */
.leftPanel {
  width: 65%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow-y: auto;
}

/* ================= RIGHT ================= */
.rightPanel {
  width: 35%;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,0.03);
  border-radius: 12px;
  padding: 10px;
}

/* ================= CARD ================= */
.card {
  background: rgba(255,255,255,0.05);
  border-radius: 12px;
  padding: 10px;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

.card-title {
  font-size: 13px;
  color: #94a3b8;
}

.card-value {
  font-size: 24px;
  font-weight: bold;
  margin-top: 3px;
}

/* COLORS */
.green { color: #00FF9C; text-shadow: 0 0 8px #00FF9C; }
.blue { color: #00BFFF; text-shadow: 0 0 8px #00BFFF; }

/* STATUS */
.badge {
  padding: 5px 10px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: bold;
}

.badge.stable { background: #00FF9C; color: black; }
.badge.warning { background: #FF9F0A; color: black; }
.badge.critical { background: #FF3B30; color: white; }

/* ================= ROW ================= */
.row {
  display: flex;
  gap: 10px;
}

.row .card {
  flex: 1;
}

/* ================= SLIDER ================= */
input[type="range"] {
  width: 100%;
  height: 5px;
  background: #1e293b;
}

/* ================= GRAPH ================= */
canvas {
  width: 100%;
  height: 80px !important;
  background: black;
  border-radius: 8px;
}

/* ================= CHAT ================= */
#chatBox {
  flex: 1;
  overflow-y: auto;
  background: #020617;
  padding: 10px;
  border-radius: 10px;
}

/* MESSAGES */
.msg {
  display: flex;
  margin-bottom: 8px;
}

.msg.ambulance { justify-content: flex-start; }
.msg.hospital { justify-content: flex-end; }

.bubble {
  max-width: 70%;
  padding: 8px;
  border-radius: 10px;
  font-size: 12px;
}

.msg.ambulance .bubble {
  background: #1e293b;
}

.msg.hospital .bubble {
  background: #00FF9C;
  color: black;
}

.time {
  font-size: 9px;
  opacity: 0.6;
}

/* INPUT */
.chatInput {
  display: flex;
  gap: 5px;
  margin-top: 5px;
}

.chatInput input {
  flex: 1;
  padding: 6px;
  border-radius: 6px;
  border: none;
  background: #1e293b;
  color: white;
}

.chatInput button {
  padding: 6px 10px;
  border-radius: 6px;
  border: none;
  background: #00FF9C;
  cursor: pointer;
}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="leftPanel">
    <h3>🚑 Ambulance Panel</h3>

    <!-- ROW: HR + SPO2 -->
    <div class="row">
      <div class="card">
        <div class="card-title">Heart Rate</div>
        <div class="card-value green" id="hrVal">--</div>
      </div>

      <div class="card">
        <div class="card-title">SpO2</div>
        <div class="card-value blue" id="spo2Val">--</div>
      </div>
    </div>

    <!-- SLIDERS -->
    <input type="range" id="hr" min="60" max="180">
    <input type="range" id="spo2" min="70" max="100">

    <!-- STATE -->
    <div class="card">
      <div class="card-title">State</div>
      <div id="state" class="badge stable">STABLE</div>
    </div>

    <!-- ECG -->
    <div class="card">
      <div class="card-title">Heart Rate (ECG)</div>
      <canvas id="hrGraph"></canvas>
    </div>

    <!-- SPO2 GRAPH -->
    <div class="card">
      <div class="card-title">SpO2 Monitor</div>
      <canvas id="spo2Graph"></canvas>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="rightPanel">
    <h4>💬 Chat</h4>

    <div id="chatBox"></div>

    <div class="chatInput">
      <input id="msgInput" placeholder="Type message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>
const socket = io();

const hr = document.getElementById("hr");
const spo2 = document.getElementById("spo2");

const hrVal = document.getElementById("hrVal");
const spo2Val = document.getElementById("spo2Val");
const stateEl = document.getElementById("state");

let state = "STABLE";
let t = 0;
let lastLocation = null;

/* CHART */
function createChart(id, color) {
  return new Chart(document.getElementById(id), {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        data: [],
        borderColor: color,
        borderWidth: 2,
        tension: 0,
        pointRadius: 0
      }]
    },
    options: {
      animation: false,
      scales: { x: { display: false }, y: { display: false } },
      plugins: { legend: { display: false } }
    }
  });
}

const hrChart = createChart("hrGraph", "#FF3B30");
const spo2Chart = createChart("spo2Graph", "#00BFFF");

/* ECG */
function generateECG() {
  const p = [0, 0.2, 0, -0.5, 3, -1.5, 0, 0];
  return p[Math.floor(Math.random() * p.length)];
}

/* VITALS */
function generateVitals() {
  t++;

  let heartRate, spo2ValGenerated;

  if (state === "STABLE") {
    heartRate = 80;
    spo2ValGenerated = 97;
    if (t > 10) state = "WARNING";
  } else if (state === "WARNING") {
    heartRate = 110;
    spo2ValGenerated = 93;
    if (t > 20) state = "CRITICAL";
  } else if (state === "CRITICAL") {
    heartRate = 140;
    spo2ValGenerated = 85;
    if (t > 30) state = "RECOVERY";
  } else {
    heartRate = 100;
    spo2ValGenerated = 95;
    if (t > 40) { t = 0; state = "STABLE"; }
  }

  return { heartRate, spo2: spo2ValGenerated };
}

/* UI */
function updateStateUI(state) {
  stateEl.className = "badge";
  if (state === "STABLE") stateEl.classList.add("stable");
  else if (state === "WARNING") stateEl.classList.add("warning");
  else stateEl.classList.add("critical");
  stateEl.innerText = state;
}

function updateChart(chart, value) {
  chart.data.labels.push("");
  chart.data.datasets[0].data.push(value);
  if (chart.data.labels.length > 30) {
    chart.data.labels.shift();
    chart.data.datasets[0].data.shift();
  }
  chart.update();
}

/* MAIN LOOP */
function sendData() {
  const v = generateVitals();

  hr.value = v.heartRate;
  spo2.value = v.spo2;

  hrVal.innerText = v.heartRate;
  spo2Val.innerText = v.spo2;

  updateStateUI(state);

  updateChart(hrChart, generateECG());
  updateChart(spo2Chart, v.spo2);

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        lastLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };

        socket.emit("vitals", {
          heartRate: v.heartRate,
          spo2: v.spo2,
          lat: lastLocation.lat,
          lng: lastLocation.lng,
          timestamp: Date.now()
        });
      },
      () => {
        if (lastLocation) {
          socket.emit("vitals", {
            heartRate: v.heartRate,
            spo2: v.spo2,
            lat: lastLocation.lat,
            lng: lastLocation.lng,
            timestamp: Date.now()
          });
        }
      }
    );
  }
}

setInterval(sendData, 2000);

/* CHAT */
const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");

function sendMessage() {
  const message = msgInput.value;
  if (!message) return;

  socket.emit("send_message", {
    sender: "AMBULANCE",
    message,
    time: new Date().toLocaleTimeString()
  });

  msgInput.value = "";
}

socket.on("receive_message", (data) => {
  const msg = document.createElement("div");

  msg.className = data.sender === "AMBULANCE"
    ? "msg ambulance"
    : "msg hospital";

  msg.innerHTML = `
    <div class="bubble">
      <div>${data.message}</div>
      <div class="time">${data.time}</div>
    </div>
  `;

  chatBox.appendChild(msg);
  chatBox.scrollTop = chatBox.scrollHeight;
});
</script>

</body>
</html>
